<!DOCTYPE html>
<html>
    <head>
        <title>praktikum from</title>
    </head>
    <body>
        <h1>from pendaftaran SPMB</h1>
        <from>
            <table>
                <tr>
                    <td><label>nama lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="masukan nama lengkap"></td>
                </tr>
                <tr>
                    <td><label>NIK</label></td>
                    <td>:</td>
                    <td><input type="number"><br></td>
                </tr>
                <tr>
                    <td><label>email</label></td>
                    <td>:</td>
                    <td><input type="email"><br></td>
                </tr>
                <tr>
                    <td>password</td>
                    <td>:</td>
                    <td><input type="password"><br></td>
                </tr>
                <tr>
                    <td><label alamat></label></td>
                    <td>:</td>
                    <td><textarea placeholder="masukan alamat"></textarea><br></td>
                </tr>
                <tr>
                    <td><label>tanggal lahir</label></td>
                    <td>:</td>
                    <td><input type="date"><br></td>
                </tr>
                <tr>
                    <td><label jenis kelamin></label></td>
                    <td>:</td>
                    <td>
                         <input type="radio" name="jeniskelamin">lakilaki
                         <input type="radio" name="jeniskelamin">perempuan
                         <br>
                    </td>
                </tr>
                <tr>
                    <td><label>mata pelajaran yang disukai</label><br></td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" name="mapel">matematika
                        <input type="checkbox" name="mapel">b inggris
                        <input type="checkbox" name="mapel">b indonesia
                        <input type="checkbox" name="mapel">fisika<br>
                    </td>
                </tr>
                <tr>
                    <td><label>jurusan</label></td>
                    <td>:</td>
                    <td>
                        <select name="jurusan">
                            <option value="RPL">RPL</option>
                            <option value="TKJ">TKJ</option>
                             <option value="PG">PG</option>
                        </select><br>
                    </td>
                </tr>
                <tr>
                    <td><label>UPLOAD foto</label></td>
                    <td>:</td>
                    <td><input type="file"><br></td>
                </tr>
                <tr>
                    <td><button type="submit">submit</button></td>
                </tr>
                <tr>
                    <td><button type="reset">reset</button></td>
                </tr>
                 </table>
        </from>
    </body>
</html>
